name: Build Android APK

on:
  push:
    branches:
      - feature/markdown-editor-mvp
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # The legacy repository does not contain gradlew/gradle-wrapper files.
      # Android Gradle Plugin 3.0.0 is compatible with Gradle 4.1.
      - name: Set up Gradle 4.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-4.1-bin.zip -o /tmp/gradle-4.1-bin.zip
          unzip -q /tmp/gradle-4.1-bin.zip -d /tmp
          echo "/tmp/gradle-4.1/bin" >> $GITHUB_PATH

      - name: Verify build environment
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Markdown-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
