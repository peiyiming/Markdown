name: Build Android APK

on:
  push:
    branches:
      - feature/markdown-editor-mvp
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 3.0.0 cannot parse metadata from modern Android SDK packages.
      # Build against a clean, isolated SDK containing only the legacy API 26 tools.
      - name: Set up isolated Android SDK
        run: |
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cmdline-tools.zip
          unzip -q /tmp/android-cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-26" \
            "build-tools;26.0.3"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # The legacy repository does not contain gradlew/gradle-wrapper files.
      # Android Gradle Plugin 3.0.0 is compatible with Gradle 4.1.
      - name: Set up Gradle 4.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-4.1-bin.zip -o /tmp/gradle-4.1-bin.zip
          unzip -q /tmp/gradle-4.1-bin.zip -d /tmp
          echo "/tmp/gradle-4.1/bin" >> $GITHUB_PATH

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list | head -n 40

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Markdown-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
