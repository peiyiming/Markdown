<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root { --page:#F7F7F5; --surface:#FFFFFF; --text:#1C1C1A; --muted:#6B6B66; --line:#E7E7E1; --accent:#2F6B5F; --code:#F1F1EE; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--page); }
    body { padding:28px 22px 48px; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",sans-serif; font-size:17px; line-height:1.82; word-break:break-word; -webkit-font-smoothing:antialiased; }
    article { max-width:760px; margin:0 auto; }
    h1,h2,h3,h4,h5,h6 { color:var(--text); line-height:1.32; letter-spacing:-.01em; margin:1.6em 0 .55em; font-weight:700; }
    h1 { font-size:2em; margin-top:.4em; } h2 { font-size:1.55em; } h3 { font-size:1.22em; }
    p { margin:0 0 1em; }
    a { color:var(--accent); text-decoration:none; border-bottom:1px solid rgba(47,107,95,.25); }
    blockquote { margin:1.35em 0; padding:.15em 0 .15em 1em; color:var(--muted); border-left:3px solid var(--accent); }
    blockquote p:last-child { margin-bottom:0; }
    ul,ol { padding-left:1.45em; margin:.6em 0 1.1em; }
    li+li { margin-top:.35em; }
    hr { border:0; height:1px; background:var(--line); margin:2em 0; }
    code { font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; font-size:.86em; padding:.15em .35em; background:var(--code); border-radius:5px; }
    pre { margin:1.3em 0; padding:16px; overflow-x:auto; background:#20201E; color:#F2F2ED; border-radius:12px; line-height:1.65; }
    pre code { padding:0; background:transparent; color:inherit; font-size:.82em; }
    img { display:block; max-width:100%; height:auto; margin:1.25em auto; border-radius:10px; }
    .image-error { display:block; margin:1.25em 0; padding:12px 14px; color:var(--muted); background:var(--surface); border:1px dashed var(--line); border-radius:10px; font-size:14px; }
    table { width:100%; margin:1.25em 0; border-collapse:collapse; font-size:.92em; }
    th,td { padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { color:var(--muted); font-weight:600; background:var(--surface); }
    .empty { min-height:40vh; display:flex; align-items:center; justify-content:center; color:#A0A09A; font-size:15px; }
    .error { padding:18px; color:#8A3A32; background:#FFF5F3; border-radius:12px; font-size:14px; }
  </style>
  <script src="./marked.js"></script>
</head>
<body>
  <article id="content"></article>
  <script>
    function parseMarkdown(value) {
      var parser = window.marked;
      if (!parser) throw new Error('marked.js 未加载');
      if (typeof parser.parse === 'function') return parser.parse(value, { gfm: true, breaks: true });
      if (typeof parser === 'function') return parser(value, { gfm: true, breaks: true });
      throw new Error('marked.js API 不兼容');
    }

    function prepareImages(content) {
      var images = content.getElementsByTagName('img');
      for (var i = 0; i < images.length; i++) {
        var image = images[i];
        image.loading = 'lazy';
        image.decoding = 'async';
        image.onerror = function () {
          var fallback = document.createElement('div');
          fallback.className = 'image-error';
          fallback.textContent = '图片无法加载：' + (this.alt || '请检查图片访问权限');
          if (this.parentNode) this.parentNode.replaceChild(fallback, this);
        };
      }
    }

    function restoreScroll(scrollY) {
      window.requestAnimationFrame(function () {
        var maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
        window.scrollTo(0, Math.min(scrollY, maxY));
      });
    }

    function renderMarkdown(source) {
      var content = document.getElementById('content');
      var value = source == null ? '' : String(source);
      var previousScrollY = window.scrollY || window.pageYOffset || 0;

      if (!value.trim()) {
        content.innerHTML = '<div class="empty">开始创作后，内容会显示在这里</div>';
        restoreScroll(previousScrollY);
        return true;
      }

      try {
        var html = parseMarkdown(value);
        if (typeof html !== 'string') throw new Error('Markdown Parser 未返回 HTML');
        content.innerHTML = html;
        prepareImages(content);
        restoreScroll(previousScrollY);
        return true;
      } catch (error) {
        content.innerHTML = '<div class="error">Markdown 渲染失败：' + escapeHtml(error && error.message ? error.message : '未知错误') + '</div>';
        restoreScroll(previousScrollY);
        return false;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
