<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --page: #F7F7F5;
      --surface: #FFFFFF;
      --text: #1C1C1A;
      --muted: #6B6B66;
      --line: #E7E7E1;
      --accent: #2F6B5F;
      --code: #F1F1EE;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--page); }
    body {
      padding: 28px 22px 48px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 17px;
      line-height: 1.82;
      word-break: break-word;
      -webkit-font-smoothing: antialiased;
    }
    article { max-width: 760px; margin: 0 auto; }
    h1, h2, h3, h4, h5, h6 {
      color: var(--text);
      line-height: 1.32;
      letter-spacing: -0.01em;
      margin: 1.6em 0 0.55em;
      font-weight: 700;
    }
    h1 { font-size: 2em; margin-top: 0.4em; }
    h2 { font-size: 1.55em; }
    h3 { font-size: 1.22em; }
    p { margin: 0 0 1em; }
    a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(47, 107, 95, 0.25); }
    strong { font-weight: 700; }
    blockquote {
      margin: 1.35em 0;
      padding: 0.15em 0 0.15em 1em;
      color: var(--muted);
      border-left: 3px solid var(--accent);
    }
    blockquote p:last-child { margin-bottom: 0; }
    ul, ol { padding-left: 1.45em; margin: 0.6em 0 1.1em; }
    li + li { margin-top: 0.35em; }
    hr { border: 0; height: 1px; background: var(--line); margin: 2em 0; }
    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.86em;
      padding: 0.15em 0.35em;
      background: var(--code);
      border-radius: 5px;
    }
    pre {
      margin: 1.3em 0;
      padding: 16px;
      overflow-x: auto;
      background: #20201E;
      color: #F2F2ED;
      border-radius: 12px;
      line-height: 1.65;
    }
    pre code { padding: 0; background: transparent; color: inherit; font-size: 0.82em; }
    img { display: block; max-width: 100%; height: auto; margin: 1.25em auto; border-radius: 10px; }
    table { width: 100%; margin: 1.25em 0; border-collapse: collapse; font-size: 0.92em; overflow: hidden; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; background: var(--surface); }
    .empty {
      min-height: 40vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #A0A09A;
      font-size: 15px;
    }
  </style>
  <script src="marked.js"></script>
</head>
<body>
  <article id="content"></article>
  <script>
    function renderMarkdown(source) {
      var content = document.getElementById('content');
      var value = source || '';
      if (!value.trim()) {
        content.innerHTML = '<div class="empty">开始创作后，内容会显示在这里</div>';
        return;
      }
      if (window.marked && typeof window.marked.parse === 'function') {
        content.innerHTML = window.marked.parse(value, { breaks: true, gfm: true });
      } else if (typeof window.marked === 'function') {
        content.innerHTML = window.marked(value);
      } else {
        content.textContent = value;
      }
    }
  </script>
</body>
</html>
